<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>创作精选 · 无限画布</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="list">

<!-- ═══ 顶栏（唯一导航，所有视图共享） ═══ -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" data-icon="sparkles"></span>
    <span class="brand-name">无限画布</span>
    <span class="brand-sub">创作精选</span>
  </div>
  <div class="topbar-actions">
    <button class="btn-ghost" id="btn-my-canvas">我的画布</button>
    <button class="btn-primary" id="btn-publish"><span data-icon="clapperboard"></span>发布作品</button>
  </div>
</header>

<!-- ═══ 视图一：精选列表 ═══ -->
<main class="list-view">
  <div class="page-head">
    <h1>创作精选</h1>
    <p>看看别人用画布创作了什么，打开即可查看完整创作过程</p>
  </div>

  <div class="filter-row">
    <nav class="tabs" id="tabs" aria-label="作品分类"></nav>
    <label class="search-box">
      <span class="search-icon" data-icon="search"></span>
      <input type="search" id="search-input" placeholder="搜索作品或作者" autocomplete="off">
    </label>
  </div>

  <section class="work-grid" id="work-grid" aria-live="polite"></section>

  <div class="empty-state" id="empty-state" hidden>
    <span class="empty-icon" data-icon="film"></span>
    <p>没有找到相关作品</p>
    <button class="btn-ghost" id="btn-clear-search">清除搜索条件</button>
  </div>
</main>

<!-- ═══ 视图二：作品预览弹层 ═══ -->
<section class="overlay" id="detail-overlay" hidden>
  <div class="overlay-header">
    <div class="oh-left">
      <button class="btn-icon" id="detail-back" title="返回列表" data-icon="chevron-left"></button>
      <h2 id="detail-title">作品预览</h2>
    </div>
    <div class="oh-actions">
      <button class="btn-primary" id="detail-fork"><span data-icon="copy"></span>复制项目</button>
      <button class="btn-icon" id="detail-close" title="关闭" data-icon="x"></button>
    </div>
  </div>
  <div class="detail-body">
    <div class="detail-media">
      <video id="detail-video" controls preload="metadata" playsinline></video>
    </div>
    <aside class="detail-info">
      <div class="author-row">
        <span class="avatar" id="detail-avatar"></span>
        <div class="author-meta">
          <strong id="detail-author"></strong>
          <small id="detail-date"></small>
        </div>
        <button class="btn-follow" id="detail-follow">关注</button>
      </div>
      <div class="stats-row">
        <button class="stat-like" id="detail-like">
          <span class="stat-icon" data-icon="heart"></span><span class="mono" id="detail-like-count">0</span>
        </button>
        <span class="stat-item"><span class="stat-icon" data-icon="eye"></span><span class="mono" id="detail-views">0</span></span>
        <span class="stat-item"><span class="stat-icon" data-icon="clock"></span><span class="mono" id="detail-duration">0:00</span></span>
      </div>
      <p class="detail-desc" id="detail-desc"></p>
      <div class="tag-row" id="detail-tags"></div>
      <div class="divider"></div>
      <button class="btn-process" id="detail-open-process">
        <span data-icon="spline"></span>
        <span class="bp-text"><strong>查看创作过程</strong><small>节点画布 · 连线 · 生成记录</small></span>
        <span class="bp-arrow" data-icon="chevron-left"></span>
      </button>
    </aside>
  </div>
</section>

<!-- ═══ 视图三：创作过程画布（只读回放） ═══ -->
<section class="overlay overlay-canvas" id="process-overlay" hidden>
  <div class="overlay-header">
    <div class="oh-left">
      <button class="btn-icon" id="process-back" title="返回预览" data-icon="chevron-left"></button>
      <h2 id="process-title">创作过程</h2>
      <span class="ph-badge">只读</span>
    </div>
    <div class="oh-actions">
      <button class="btn-primary" id="process-fork"><span data-icon="copy"></span>复制项目</button>
      <button class="btn-icon" id="process-close" title="关闭" data-icon="x"></button>
    </div>
  </div>

  <div class="canvas-viewport" id="canvas-viewport">
    <div class="canvas-world" id="canvas-world">
      <svg class="edge-layer" id="edge-layer"></svg>
      <!-- 分组标题与节点由 main.js 渲染 -->
    </div>
  </div>

  <div class="canvas-toolbar">
    <button class="tool-btn" id="tool-minimap" title="切换小地图" data-icon="map"></button>
    <button class="tool-btn" id="tool-edges" title="隐藏节点连线" data-icon="spline"></button>
    <button class="tool-btn" id="tool-zoom-out" title="缩小" data-icon="zoom-out"></button>
    <button class="tool-btn" id="tool-zoom-in" title="放大" data-icon="zoom-in"></button>
    <span class="zoom-value mono" id="zoom-value">100%</span>
  </div>
  <div class="minimap-panel" id="minimap-panel" hidden>
    <canvas id="minimap" width="180" height="112"></canvas>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script src="main.js"></script>
</body>
</html>
